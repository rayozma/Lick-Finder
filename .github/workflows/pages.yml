name: Build and deploy
on:
  push: {branches: [main]}
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
env:
  WJAZZD_URL: ${{ vars.WJAZZD_URL || 'https://jazzomat.hfm-weimar.de/download/downloads/wjazzd.db' }}
  ESAC_URL: ${{ vars.ESAC_URL || 'https://jazzomat.hfm-weimar.de/download/downloads/esac.db' }}
  LMD_URL: ${{ vars.LMD_URL || 'http://hog.ee.columbia.edu/craffel/lmd' }}
  MSD_URL: ${{ vars.MSD_URL || 'http://millionsongdataset.com/sites/default/files/AdditionalFiles' }}
  TAGTRAUM_URL: ${{ vars.TAGTRAUM_URL || 'https://www.tagtraum.com/genres/msd_tagtraum_cd2c.cls.zip' }}
  THESESSION_URL: ${{ vars.THESESSION_URL || 'https://raw.githubusercontent.com/adactio/TheSession-data/main/json/tunes.json' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download the Weimar Jazz Database
        run: |
          curl -fL --retry 3 -o dl.bin "$WJAZZD_URL" || { echo "::warning::Download failed. The site will use demo data."; exit 0; }
          if unzip -tq dl.bin >/dev/null 2>&1; then unzip -o dl.bin -d dl && find dl -name '*.db' -exec mv {} wjazzd.db \; ; else mv dl.bin wjazzd.db; fi
      - name: Build the search index
        run: |
          if [ -s wjazzd.db ]; then python build_index.py wjazzd.db site/data.json; else echo "::warning::No database. Deploying demo data only."; fi
      - name: Build the folk song index (EsAC)
        run: |
          if curl -fL --retry 3 -o esac.db "$ESAC_URL"; then python build_index.py esac.db site/esac.json; else echo "::warning::EsAC download failed. Deploying without it."; fi
      - name: Build the folk tune index (The Session)
        run: |
          if curl -fL --retry 3 -o tunes.json "$THESESSION_URL"; then python build_thesession.py tunes.json site/thesession.json; else echo "::warning::The Session download failed. Deploying without folk tunes."; fi
      - name: Restore the pop song index (Lakh MIDI)
        id: lakh
        uses: actions/cache@v4
        with: {path: 'site/lakh.*', key: "lakh-${{ hashFiles('build_lakh.py') }}"}
      - name: Build the pop song index (Lakh MIDI)
        if: steps.lakh.outputs.cache-hit != 'true'
        run: |
          mkdir -p lmd && cd lmd
          for f in "$LMD_URL/lmd_matched.tar.gz" "$LMD_URL/match_scores.json" "$MSD_URL/unique_tracks.txt" "$MSD_URL/tracks_per_year.txt" "$TAGTRAUM_URL"; do
            curl -fL --retry 3 -O "$f" || { echo "::warning::Download failed: $f. Deploying without pop songs."; exit 0; }
          done
          unzip -o -q msd_tagtraum_cd2c.cls.zip && cd ..
          pip install -q pretty_midi && python build_lakh.py lmd site/lakh.json && rm -rf lmd
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
